# cargo-deny: supply-chain policy (run in CI; cargo deny check)
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # serde_yaml 0.9 -> unsafe-libyaml (RUSTSEC-2024-0449, unmaintained).
  # serde_yaml is the config-parsing dependency; migrating off it is tracked
  # as its own change (upstream suggests serde_norway / the config crate).
  "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
