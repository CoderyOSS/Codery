[package]
name = "codery-ci"
version = "0.15.0"
edition = "2021"
rust-version = "1.90"
description = "CoderyCI — blue/green deploy orchestrator, MCP control plane, and host metrics for the Codery platform"
license = "MIT"
repository = "https://github.com/CoderyOSS/Codery"

[[bin]]
name = "codery-ci"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
bollard = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"
anyhow = "1"
futures-util = "0.3"
rmcp = { version = "1", features = ["server", "transport-streamable-http-server", "schemars"] }
tar = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"
rusqlite = { version = "0.34", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Lint policy is enforced in-tree so local builds, CI, and editors all agree.
# CI runs plain `cargo clippy --all-targets` — no CLI severity overrides.
[lints.rust]
unsafe_code = "deny"
warnings = "deny"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
pedantic = { level = "warn", priority = -1 }
