# zoraxy — CORE layer: the routing edge.
#
# Terminates TLS for *.rancidgrandmas.online (wildcard cert via Cloudflare
# DNS-01), proxies every vhost to codery-net container names — HTTP services
# need no host port publishes. Also runs the uptime monitor. Everything binds
# the tailnet IP only; the public interface stays closed (no firewall needed).
#
#   :443/:80  vhost traffic (proxied by Host header)
#   :8000     management UI — tailnet-only, reachable even if Zoraxy's own
#             proxy config breaks (never proxied through itself)
#
# State (vhosts, certs, accounts) lives in the zoraxy_state volume;
# stacks/core/zoraxy/bootstrap-state.sh restores it into a wiped volume.
# Boot-order race (docker before tailscale0) is covered by the host sysctl
# net.ipv4.ip_nonlocal_bind=1 — see host/ + ARCHITECTURE.md.
name: zoraxy

services:
  zoraxy:
    image: zoraxydocker/zoraxy:latest
    container_name: zoraxy
    restart: unless-stopped
    ports:
      - "${TAILNET_IP:?set TAILNET_IP in stack .env}:443:443"
      - "${TAILNET_IP}:80:80"
      - "${TAILNET_IP}:8000:8000"
    volumes:
      - zoraxy_state:/root/zoraxy
    environment:
      TZ: America/Los_Angeles
    networks:
      codery-net: {}

networks:
  codery-net:
    external: true

volumes:
  zoraxy_state:
