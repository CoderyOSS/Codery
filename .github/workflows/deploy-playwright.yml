name: Deploy Playwright

# Manual-only. Playwright is pull-only infrastructure: there is no build
# step and no Codery-owned image. This workflow syncs the service YAML and
# deploys Microsoft's pinned image directly from MCR.
#
# Version coupling: the MCP client pin in opencode.json, the playwright@
# pin in containers/playwright/service.yml, and this workflow's default
# version must all move together. See docs/playwright.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Playwright version to deploy (matches the MCR tag, e.g. v1.54.1)"
        required: true
        default: "v1.54.1"

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy playwright to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy playwright via codery-ci
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          trap 'rm -f /tmp/deploy_key' EXIT
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new deploy@${DEPLOY_HOST}"

          $SSH "sudo mkdir -p /opt/codery/services /opt/codery/state"
          cat containers/playwright/service.yml | $SSH "sudo tee /opt/codery/services/playwright.yml" > /dev/null

          $SSH "supervisorctl -c /etc/supervisor/supervisord.conf status codery-ci-mcp 2>/dev/null \
            | grep -q RUNNING \
            || supervisorctl -c /etc/supervisor/supervisord.conf start codery-ci-mcp 2>/dev/null \
            || echo '[mcp] codery-ci-mcp not configured yet — skipping'"

          $SSH "sudo /opt/codery/codery-ci deploy playwright ${{ github.event.inputs.version }} 2>&1"
