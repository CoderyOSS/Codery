name: Diagnose Container

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check system and container logs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Dump logs via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new deploy@${DEPLOY_HOST}"

          echo "=== All Docker containers ==="
          $SSH "docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'"

          echo "=== Port bindings (relevant ports) ==="
          $SSH "ss -tlnp | grep -E '13000|17456|10022|23000|27456|20022|2222|443|80' || echo '(none)'"

          echo "=== Codery state files ==="
          $SSH "ls -la /opt/codery/state/ && cat /opt/codery/state/* 2>/dev/null || echo '(no state files)'"

          echo "=== Host supervisorctl status ==="
          $SSH "supervisorctl -c /etc/supervisor/supervisord.conf status 2>&1 || echo '(supervisord not running)'"

          echo "=== Caddy status ==="
          $SSH "curl -s http://localhost:2019/config/ 2>&1 | head -20 || echo '(caddy admin not reachable)'"

          echo "=== Paseo green container logs (last 50 lines) ==="
          $SSH "docker logs codery-paseo-green --tail 50 2>&1 || echo '(no codery-paseo-green)'"

          echo "=== Apps blue container logs (last 50 lines) ==="
          $SSH "docker logs codery-apps-blue --tail 50 2>&1 || echo '(no codery-apps-blue)'"

          echo "=== Apps s6 services (active container) ==="
          ACTIVE=$($SSH "cat /opt/codery/state/apps.color 2>/dev/null || echo blue")
          $SSH "docker exec codery-apps-${ACTIVE} /command/s6-svstat /run/service/* 2>&1 || echo '(container not running)'"

          rm -f /tmp/deploy_key
