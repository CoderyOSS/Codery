# GitAuthGate (gag) — project stack, imported in place (this file IS the
# deployed stack definition; the stack .env lives beside it, gitignored).
#
# Setup (see README.md for the full walk-through):
#   1. docker pull coderyoss/codery-gitgate:0.1.0
#      (pre-publish: docker build -t codery-gitgate:0.1.0 <repo>/images/gate)
#   2. cp .env.example .env — fill GATE_PUBLIC_URL, GATE_TOKEN_ENC_KEY,
#      GATE_MACHINE_LOGIN
#   3. run it: Dockhand → import this compose (plain host: docker compose up -d;
#      create the codery-net network first if absent)
#   4. browse to the gate page via your reverse proxy → /setup/token
#      custodies the machine PAT (encrypted into /data/gate.db)
#
# Zoraxy (Codery hosts) proxies gag.<domain> -> gitauthgate:8080; no host
# port publish. build:+pull_policy:never keeps dockhand from pulling a
# DockerHub image that doesn't exist yet.
services:
  gate:
    image: codery-gitgate:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    container_name: gitauthgate