# GitAuthGate (gag) — standalone compose (DockerHub / plain-docker path).
# Codery hosts deploy via the devtools stack's gitauthgate service instead
# (stacks/tools/devtools/compose.yml, `gag` profile) — this file is the
# self-contained deployment for hosts without the devtools stack.
#
# Setup (see README.md for the full walk-through):
#   1. docker pull coderyoss/codery-gitgate:0.2.0
#      (pre-publish: docker build -t codery-gitgate:0.2.0 <repo>/images/gate)
#   2. cp .env.example .env — fill GATE_PUBLIC_URL, GATE_TOKEN_ENC_KEY,
#      GATE_MACHINE_LOGIN, and the four NTFY_* channel keys (GATE-013;
#      a partial set refuses to boot)
#   3. run it: docker network create codery-net (if absent);
#      docker compose up -d
#   4. browse to the gate page via your reverse proxy → /setup/token
#      custodies the machine PAT (encrypted into /data/gate.db)
#
# The volume auto-seeds with gate's baked /data ownership (uid 65532) on
# first mount — no manual chown. The policy file is bind-mounted
# read-only: it is config, not state.
services:
  gate:
    image: codery-gitgate:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    container_name: gitauthgate
    restart: unless-stopped
    networks:
      codery-net:
        aliases:
          - gitauthgate
    environment:
      GATE_PUBLIC_URL: ${GATE_PUBLIC_URL:-}
      GATE_TOKEN_ENC_KEY: ${GATE_TOKEN_ENC_KEY:?required — see .env.example}
      GATE_MACHINE_LOGIN: ${GATE_MACHINE_LOGIN:?required — see .env.example}
      GATE_POLICY_PATH: /data/policy.toml
      GATE_STATE_PATH: /data/gate.db
      GATE_AUDIT_PATH: /data/audit.jsonl
      # Control channel (GATE-013): the ntfy broker. All four keys or
      # none — a partial set refuses to boot. Unset = StubBackend,
      # dangerous holds fail closed.
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_ANSWERS_TOPIC: ${NTFY_ANSWERS_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - ./policy.toml:/data/policy.toml:ro
      - gag-data:/data

networks:
  codery-net:
    external: true

volumes:
  gag-data:
