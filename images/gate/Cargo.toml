[package]
name = "gate"
version = "0.1.0"
edition = "2024"

[workspace]


[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
