[package]
name = "gate"
version = "0.1.0"
edition = "2024"

[workspace]


[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
async-trait = "0.1"
aes-gcm = "0.11"
axum = "0.8"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
base64 = "0.22"
# GATE-012 control-channel transport. default-features = false: the
# `sqlite` state-store feature links system libsqlite3-sys, which cannot
# coexist with gate's bundled rusqlite (`links = "sqlite3"`); sled gives
# the same persistent key/session store in pure Rust. rustls-aws-lc-rs is
# 0.19's only exposed TLS backend.
matrix-sdk = { version = "0.19.1", default-features = false, features = [
    "automatic-room-key-forwarding",
    "e2e-encryption",
    "rustls-aws-lc-rs",
    "bundled-sqlite",
] }

[features]
# Compiles the FakeTelegram test double into release-style builds that
# need it (e.g. future integration tests); `cargo test` always has it.
test-util = []

[dev-dependencies]
# Self dev-dependency: compiles the crate for integration tests with
# `test-util` on, so tests/telegram_approvals.rs can drive FakeTelegram
# while release builds keep the test double out (plain `cargo test`
# includes it; the feature never leaks into non-test builds).
gate = { path = ".", features = ["test-util"] }
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
