[package]
name = "gate"
version = "0.2.0"
edition = "2024"

[workspace]


[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
async-trait = "0.1"
aes-gcm = "0.11"
axum = "0.8"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
base64 = "0.22"

[features]
# Compiles the FakeTransport test double into release-style builds that
# need it (e.g. future integration tests); `cargo test` always has it.
test-util = []

# Debug info bloats test-binary links enough to OOM the host linker when
# several run in parallel; tests don't need symbols.
[profile.test]
debug = 0
split-debuginfo = "off"

[dev-dependencies]
# Self dev-dependency: compiles the crate for integration tests with
# `test-util` on, so tests/control_approvals.rs can drive FakeTransport
# while release builds keep the test double out (plain `cargo test`
# includes it; the feature never leaks into non-test builds).
gate = { path = ".", features = ["test-util"] }
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
