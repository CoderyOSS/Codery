[package]
name = "gate"
version = "0.1.0"
edition = "2024"

[workspace]


[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
async-trait = "0.1"
aes-gcm = "0.11"
axum = "0.8"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
base64 = "0.22"

[features]
# Compiles the FakeTelegram test double into release-style builds that
# need it (e.g. future integration tests); `cargo test` always has it.
test-util = []

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
