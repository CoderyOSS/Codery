# playwright — Dockhand stack definition (STAGED; deployed during migration
# W5 phase 2 — see docs/runbook/openminis-migration.md).
#
# Internal-only browser runtime: reached via ws://playwright:3000/ on
# codery-net. No host publish at all (the old blue/green 43000/53000
# loopback publishes were health-check scaffolding; Dockhand monitors the
# container state directly).
#
# VERSION COUPLING (upgrade together, one commit — see containers/playwright/service.yml):
#   opencode.json @playwright/mcp@0.0.30 + zod pins <-> npx playwright@1.54.1 <-> this image tag.
name: playwright

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.54.1-noble
    container_name: playwright
    restart: unless-stopped
    user: pwuser
    working_dir: /home/pwuser
    init: true
    ipc: host
    command: ["npx", "-y", "playwright@1.54.1", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    networks:
      codery-net:
        aliases:
          - playwright

networks:
  codery-net:
    external: true
