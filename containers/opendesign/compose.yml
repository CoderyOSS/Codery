# opendesign — Dockhand stack definition (STAGED; deployed during migration
# W5 phase 2 — see docs/runbook/openminis-migration.md).
#
# Fixed publishes replace the color scheme:
#   web 127.0.0.1:7456  (Caddy `opendesign.` route -> localhost:7456; basic
#   auth stays at the Caddy edge via OPENDESIGN_BASIC_AUTH)
name: opendesign
container_name: opendesign

services:
  opendesign:
    image: ${OPENDESIGN_IMAGE:?set OPENDESIGN_IMAGE}
    container_name: opendesign
    restart: unless-stopped
    ports:
      - "127.0.0.1:7456:7456"
    env_file:
      - /opt/codery/.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: "7456"
      OD_ALLOWED_ORIGINS: https://opendesign.rancidgrandmas.online
      PLAYWRIGHT_WS_ENDPOINT: ws://playwright:3000/
    volumes:
      - /opt/codery/data/opendesign:/app/.od
      - /opt/codery/projects:/opt/codery/projects
      - /opt/codery/github-app.pem:/run/secrets/github-app.pem:ro
    networks:
      codery-net: {}
