service: sandbox
image: ghcr.io/coderyoss/codery:sandbox-{sha}

# Port formula: host_port = container_port + offset
# blue:  opencode 3000+10000=13000
# green: opencode 3000+20000=23000
port_scheme:
  blue_offset: 10000
  green_offset: 20000

ports:
  - name: opencode
    container_port: 3000
    subdomain: opencode
    # Loopback: only host-local processes (Caddy on the host) can reach this
    # publish — the port is no longer reachable directly, only via the
    # Tailscale-bound subdomain. basic_auth adds a second gate on that path.
    bind: loopback
    auth:
      env: OPENCODE_BASIC_AUTH
  - name: opendesign
    container_port: 7456
    subdomain: opendesign
    bind: loopback
    auth:
      env: OPENDESIGN_BASIC_AUTH
  - name: ssh
    container_port: 22
    fixed_port: 2222
    # Tailnet-only: published port and the fixed-port proxy listener bind the
    # host Tailscale IP, so SSH is unreachable from any other interface.
    bind: tailnet
    # No subdomain — raw TCP, not HTTP. Caddy does not proxy this.
    # blue: host 10022  green: host 20022  (port_scheme offsets apply)
    # fixed_port: stable proxy port — orchestrator serve-tcp-proxy forwards
    # connections here to the active color's SSH port automatically.
  - name: paseo
    container_port: 6767
    subdomain: paseo
    # Paseo (paseo.sh) daemon — control plane that spawns `opencode` (and other
    # agent CLIs) as subprocesses for the iPad Paseo app. NOT the opencode HTTP
    # API; see the opencode entry above for that.
    #
    # Loopback publish + Caddy vhost (paseo.{DOMAIN} → tailnet IP, TLS via the
    # existing wildcard cert): the iPad app needs wss:// (its direct ws:// mode
    # exists but the web client refuses mixed content, and TLS gives the vhost
    # a real hostname instead of a color-dependent port). Caddy rewrites the
    # offset port on color flips automatically, so no fixed_port here — one
    # would collide with the green publish anyway (26767).
    # blue: host 17676  green: host 26767
    #
    # Auth layers: TLS + daemon password (bcrypt in ~/.paseo/config.json).
    # The daemon enforces a Host-header allowlist (PASEO_HOSTNAMES below) and
    # only /api/health is unauthenticated. Basic auth is deliberately NOT
    # layered on: the native app speaks its own WS protocol and Caddy basic
    # auth would break the WebSocket handshake.
    bind: loopback

health_check:
  type: tcp
  port: opencode
  timeout_secs: 60
  interval_secs: 2

volumes:
  - type: bind
    host: /opt/codery/projects
    container: /home/gem/projects
  - type: bind
    host: /opt/codery/data/opencode
    container: /home/gem/.local/share/opencode
  - type: bind
    host: /opt/codery/data/claude
    container: /home/gem/.claude
  - type: bind
    host: /opt/codery/data/opendesign
    container: /home/gem/open-design/.od
  - type: bind
    host: /opt/codery/data/paseo
    container: /home/gem/.paseo
  - type: bind
    host: /opt/codery/github-app.pem
    container: /run/secrets/github-app.pem
    readonly: true
  - type: bind
    host: /opt/codery/ssh/authorized_keys
    container: /run/secrets/authorized_keys
    readonly: true

env_overrides:
  GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
  # Browser runtime lives in the dedicated Playwright container
  # (mcr.microsoft.com/playwright, pinned version — see containers/playwright/
  # and docs/playwright.md). The sandbox only connects over codery-net.
  PLAYWRIGHT_WS_ENDPOINT: ws://playwright:3000/
  # OpenWiki + Z.ai GLM-5.x compat: injects thinking:{type:"disabled"} on Z.ai
  # requests so langchain's stream aggregator stays happy. Inert for non-Z.ai
  # traffic (the patch inspects URL + body shape before mutating).
  NODE_OPTIONS: --require /home/gem/bin/zai-patch.js
  # opencode-serve-guard leak backstop: SIGTERM opencode when RSS crosses
  # this (s6 respawns in seconds; history survives). The host has no swap, so
  # this must fire before opencode alone can starve the box — but it must also
  # sit well above normal long-session RSS (~1.2-1.4 GiB) or it kills sessions
  # mid-work (Sep 26: repeated kills at the old 1171 MiB line during ordinary
  # development). 2500 MiB is ~2x observed peak; if global OOM kills reappear
  # (see Sep 16: docker builds + opencode colliding), lower this first.
  OPENCORE_SERVE_KILL_KB: "2560000"
  # Paseo daemon (paseo port above). Password is NOT here — it lives as a
  # bcrypt hash in the mounted ~/.paseo/config.json. These three only set
  # transport posture: bind all interfaces inside the container (the loopback
  # Docker publish cannot reach a 127.0.0.1-bound daemon), accept the Caddy
  # vhost's Host header, and keep the daemon off the public paseo.sh relay
  # (0.11.4 enables relay by default; direct-vhost mode does not want it).
  PASEO_LISTEN: "0.0.0.0:6767"
  PASEO_HOSTNAMES: "paseo.rancidgrandmas.online"
  PASEO_RELAY_ENABLED: "false"

required_env:
  - GHCR_USERNAME
  - GHCR_TOKEN
  - ANTHROPIC_API_KEY
  - ZAI_API_KEY
  - GITHUB_APP_ID
  - GITHUB_APP_SLUG

network: codery-net

# Allow the container to reach the host (for direct MCP access over Docker bridge).
extra_hosts:
  - host.docker.internal:host-gateway
