[program:codery-ci-daemon]
command=/opt/codery/codery-ci daemon
# Build jobs (codery_exec `build`) resolve Dockerfile paths relative to this
# working directory — the Codery repo checkout shared with the sandbox at
# /home/gem/projects/Codery.
directory=/opt/codery/projects/Codery
user=root
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/codery-ci-daemon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/codery-ci-daemon.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
