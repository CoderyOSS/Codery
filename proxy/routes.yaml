# Static routes — host services only.
# Layer 2: overridden by SQLite runtime apps. Container subdomains are
# declared in each service's own service.yml (ports[].subdomain).
#
# target: "host" → direct localhost:port (no color offset)
# target: "apps" → apply apps port_scheme offset + Nginx internal routing

routes:
  - subdomain: mcp
    port: 4040
    target: host

  - subdomain: ci
    port: 4041
    target: host
